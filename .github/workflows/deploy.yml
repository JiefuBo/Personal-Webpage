name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload maintenance website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./maintenance
#          修改发布页面时修改这个参数！！！！！！！！

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
